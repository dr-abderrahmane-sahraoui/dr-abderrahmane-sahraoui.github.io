name: Update visitor countries

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-countries
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read country counts
        run: python3 .github/scripts/update_countries.py data/countries.json
      - name: Save and rebuild the site if counts changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/countries.json; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/countries.json
          git commit -m "Update visitor countries"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
