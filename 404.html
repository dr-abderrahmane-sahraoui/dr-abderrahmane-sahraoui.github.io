<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>الصفحة غير موجودة</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--paper:#faf6ee;--ink:#2a2320;--muted:#6c6158;--accent:#7a2a2c}

body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;background:var(--paper);color:var(--ink);font-family:"Noto Naskh Arabic","Traditional Arabic",serif;text-align:center;line-height:1.9}
h1{color:var(--accent);font-size:32px;margin:0}
p{color:var(--muted);margin:4px 0 16px}
a{color:var(--accent);font-weight:600}
</style>
</head>
<body><main><h1>الصفحة غير موجودة</h1><p>ربما تغيّر الرابط أو كُتب خطأ.</p><a href="/">العودة إلى موقع د. عبد الرحمن صحراوي</a></main></body>
